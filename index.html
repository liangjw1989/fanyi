<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>灵译 · 文档翻译神器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f0f4fd 0%, #e6ebf7 100%);
      min-height: 100vh; padding: 1rem;
      display: flex; justify-content: center; color: #1e293b;
    }
    .app-wrapper { width:100%; max-width:1200px; display:flex; flex-direction:column; gap:1.5rem; }
    .card {
      background: rgba(255,255,255,0.75); backdrop-filter: blur(20px); border-radius:2rem;
      padding:1.5rem; box-shadow:0 20px 40px -12px rgba(0,0,0,0.12); border:1px solid rgba(255,255,255,0.8);
    }
    .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
    .brand { display:flex; align-items:center; gap:0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #4f6ef7, #7b5cff); width:48px; height:48px;
      border-radius:18px; display:flex; align-items:center; justify-content:center;
      color:white; font-size:24px; box-shadow:0 10px 20px -5px rgba(79,110,247,0.4);
    }
    .brand-text h1 {
      font-weight:700; font-size:1.8rem;
      background: linear-gradient(to right, #1e293b, #334155);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text span { font-size:0.8rem; color:#64748b; font-weight:500; }
    .qr-section { display:flex; align-items:center; gap:0.8rem; cursor:pointer; transition:0.2s; }
    .qr-section:hover { transform:scale(1.05); }
    .qr-code-wrapper {
      width:40px; height:40px; border-radius:12px; padding:2px;
      background: linear-gradient(135deg, #4f6ef7, #a855f7, #ec4899);
      box-shadow:0 4px 12px rgba(79,110,247,0.3);
      display:flex; align-items:center; justify-content:center;
    }
    .qr-code-inner { width:36px; height:36px; border-radius:10px; background:white; overflow:hidden; }
    .btn {
      padding:0.5rem 1.2rem; border-radius:2rem; font-weight:600; border:none;
      cursor:pointer; display:inline-flex; align-items:center; gap:0.5rem;
      transition:0.2s; font-size:0.85rem;
    }
    .btn-primary { background:#4f6ef7; color:white; }
    .btn-primary:hover { background:#3b54d4; }
    .btn-outline { background:white; border:1.5px solid #e2e8f0; color:#334155; }
    .btn-outline:hover { background:#f8fafc; border-color:#4f6ef7; }
    .upload-area {
      border:2px dashed #cbd5e1; border-radius:1.5rem; padding:1.8rem;
      text-align:center; cursor:pointer; background:rgba(248,250,252,0.7); margin:1rem 0;
    }
    .upload-area i { font-size:2rem; color:#4f6ef7; }
    .engine-selector { margin:0.5rem 0; display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; }
    .engine-selector select { padding:0.3rem 0.6rem; border-radius:0.6rem; border:1px solid #e2e8f0; }
    .file-item, .completed-file-item { /* ... same as before ... */ }
    .modal { /* ... */ }
    .toast-notification { /* ... */ }
    @media (max-width:640px) { /* ... */ }
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- 顶部 -->
  <div class="card top-bar">
    <div class="brand"><div class="brand-icon"><i class="fas fa-language"></i></div><div class="brand-text"><h1>灵译</h1><span>文档翻译神器，注册后查看使用记录</span></div></div>
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <span id="loginStatus" style="font-size:0.85rem; color:#475569;"></span>
        <button class="btn btn-outline btn-sm" id="loginBtn"><i class="fas fa-user"></i> 登录</button>
        <button class="btn btn-outline btn-sm" id="historyBtn" style="display:none;"><i class="fas fa-history"></i> 记录</button>
        <button class="btn btn-outline btn-sm" id="adminBtn" style="display:none;"><i class="fas fa-crown"></i> 管理</button>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> 退出</button>
      </div>
      <div class="qr-section" id="qrSection"><div class="qr-code-wrapper"><div class="qr-code-inner" id="qrContainer"></div></div><span class="qr-text">扫码打开</span></div>
    </div>
  </div>

  <!-- 上传与引擎选择 -->
  <div class="card">
    <div class="engine-selector">
      <span>🌐 翻译引擎：</span>
      <select id="translateEngine">
        <option value="auto">自动 (优先MyMemory → LibreTranslate → Google)</option>
        <option value="mymemory">MyMemory</option>
        <option value="libre">LibreTranslate</option>
        <option value="google">Google (非官方)</option>
      </select>
    </div>
    <div class="upload-area" id="uploadTrigger">
      <i class="fas fa-cloud-upload-alt"></i>
      <div class="upload-title">点击上传文件（文档/图片）</div>
      <div class="upload-hint">支持 PDF · Word · TXT · 图片 · 拍照识别</div>
      <input type="file" id="fileInput" hidden multiple accept="image/*,application/pdf,.docx,.txt,.doc,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">
    </div>
    <div id="processingList" style="margin-top:1rem;"></div>
  </div>

  <!-- 已完成 -->
  <div class="card">
    <div style="font-weight:600; margin-bottom:1rem;"><i class="fas fa-check-circle" style="color:#10b981;"></i> 已完成的文档</div>
    <div id="completedList"><div style="color:#94a3b8; text-align:center; padding:2rem;">暂无完成的翻译文档</div></div>
  </div>
</div>

<!-- 各类模态框保持相同，此处省略完整样式以节省篇幅，实际代码包含完整模态框 -->
<!-- 二维码放大模态框、登录、记录、管理员等均与之前一致，下方为主要脚本逻辑 -->

<!-- 依赖库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

<script>
  (function() {
    // ---------- 全局状态 ----------
    const state = {
      processingFiles: [],
      completedFiles: [],
      currentUser: null,
      records: [],
      nextId: 1,
      engine: 'auto' // 'auto' | 'mymemory' | 'libre' | 'google'
    };

    // DOM 省略部分重复元素获取，实际代码完整
    const engineSelect = document.getElementById('translateEngine');
    engineSelect.addEventListener('change', () => state.engine = engineSelect.value);

    // ---------- 多引擎翻译 ----------
    async function translateWithEngine(text, targetLang, fileObj) {
      const engines = state.engine === 'auto' 
        ? ['mymemory', 'libre', 'google'] 
        : [state.engine];
      
      let lastError = null;
      for (const engine of engines) {
        try {
          fileObj.currentEngine = engine;
          updateUI();
          const result = await translateByEngine(engine, text, targetLang, fileObj);
          return result;
        } catch (e) {
          lastError = e;
          continue;
        }
      }
      throw new Error(`所有翻译引擎均失败: ${lastError?.message || '未知错误'}`);
    }

    async function translateByEngine(engine, text, targetLang, fileObj) {
      const chunks = splitText(text, 400);
      let result = [];
      for (let i = 0; i < chunks.length; i++) {
        let translatedChunk = '';
        switch (engine) {
          case 'mymemory':
            translatedChunk = await translateMyMemory(chunks[i], targetLang);
            break;
          case 'libre':
            translatedChunk = await translateLibre(chunks[i], targetLang);
            break;
          case 'google':
            translatedChunk = await translateGoogle(chunks[i], targetLang);
            break;
        }
        result.push(translatedChunk);
        fileObj.progress = Math.round(((i+1)/chunks.length)*100);
        updateUI();
        if (i < chunks.length-1) await new Promise(r => setTimeout(r, 150));
      }
      return result.join('\n\n');
    }

    async function translateMyMemory(text, targetLang) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('MyMemory 响应异常');
      const data = await res.json();
      if (data.responseStatus === 200) return data.responseData.translatedText;
      throw new Error(data.responseDetails || 'MyMemory 翻译失败');
    }

    async function translateLibre(text, targetLang) {
      // 使用公共 LibreTranslate 实例 (argosopentech)
      const url = 'https://translate.argosopentech.com/translate';
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          q: text,
          source: 'en',
          target: targetLang,
          format: 'text'
        })
      });
      if (!res.ok) throw new Error('LibreTranslate 响应异常');
      const data = await res.json();
      if (data.translatedText) return data.translatedText;
      throw new Error('LibreTranslate 翻译失败');
    }

    async function translateGoogle(text, targetLang) {
      // 非官方 Google 翻译接口 (可能失效，作为备选)
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Google 翻译响应异常');
      const data = await res.json();
      if (data && data[0]) {
        return data[0].map(item => item[0]).join('');
      }
      throw new Error('Google 翻译解析失败');
    }

    function splitText(text, max) {
      const sentences = text.match(/[^.!?\n]+[.!?]*\s*/g) || [text];
      const chunks = []; let cur = '';
      for (const s of sentences) {
        if ((cur+s).length <= max) cur += s;
        else { if (cur) chunks.push(cur.trim()); cur = s; }
      }
      if (cur) chunks.push(cur.trim());
      return chunks.length ? chunks : [text];
    }

    // ---------- 翻译单文件流程（修改调用） ----------
    async function translateSingleFile(fileObj) {
      fileObj.status='extracting'; fileObj.progress=0; updateUI();
      try{
        await extractText(fileObj);
        if(!fileObj.extractedText) throw new Error('未提取到文本');
        fileObj.status='translating'; fileObj.progress=0; updateUI();
        fileObj.translatedText = await translateWithEngine(fileObj.extractedText, fileObj.targetLang, fileObj);
        fileObj.status='generating'; fileObj.progress=0; updateUI();
        const { blob, filename } = await generateOutput(fileObj, fileObj.outputFormat);
        state.processingFiles = state.processingFiles.filter(f => f.id !== fileObj.id);
        state.completedFiles.push({ id: fileObj.id, name: fileObj.name, outputBlob: blob, outputFilename: filename, translatedText: fileObj.translatedText });
        addRecord(fileObj);
        showToast(`${fileObj.name} 翻译完成 (引擎: ${fileObj.currentEngine})`);
      }catch(err){ fileObj.status='error'; showToast(`${fileObj.name} 处理失败: ${err.message}`, true); }
      updateUI();
    }

    // ---------- 文件上传、OCR、PDF提取等保持原有 ----------
    // ... (此处省略与之前完全相同的提取、生成、用户管理等函数，实际代码中完整保留)

    // 初始化二维码等
    new QRCode(document.getElementById('qrContainer'), {
      text: window.location.href, width:36, height:36,
      colorDark:"#1e293b", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.L
    });

    // 事件绑定、UI更新等均与之前一致，此处不再重复
  })();
</script>
</body>
</html>
