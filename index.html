<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>灵译 · 文档翻译神器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f0f4fd 0%, #e6ebf7 100%);
      min-height: 100vh;
      padding: 1rem;
      display: flex;
      justify-content: center;
      color: #1e293b;
    }
    .app-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 1.5rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-icon {
      background: linear-gradient(135deg, #4f6ef7, #7b5cff);
      width: 48px; height: 48px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 24px;
      box-shadow: 0 10px 20px -5px rgba(79,110,247,0.4);
    }
    .brand-text h1 {
      font-weight: 700; font-size: 1.8rem;
      background: linear-gradient(to right, #1e293b, #334155);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text span { font-size:0.8rem; color:#64748b; font-weight:500; }

    .qr-section {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .qr-section:hover { transform: scale(1.05); }
    .qr-code-wrapper {
      width: 40px; height: 40px;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(135deg, #4f6ef7, #a855f7, #ec4899);
      box-shadow: 0 4px 12px rgba(79,110,247,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-code-inner {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .qr-text { font-size:0.75rem; color:#475569; font-weight:500; }

    .btn {
      padding:0.5rem 1.2rem; border-radius:2rem; font-weight:600; border:none;
      cursor:pointer; display:inline-flex; align-items:center; gap:0.5rem;
      transition:0.2s; font-size:0.85rem;
    }
    .btn-primary { background:#4f6ef7; color:white; box-shadow:0 6px 14px -6px rgba(79,110,247,0.5); }
    .btn-primary:hover { background:#3b54d4; }
    .btn-outline { background:white; border:1.5px solid #e2e8f0; color:#334155; }
    .btn-outline:hover { background:#f8fafc; border-color:#4f6ef7; }
    .btn-danger { background:#ef4444; color:white; }
    .btn-sm { padding:0.3rem 0.8rem; font-size:0.75rem; }

    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 1.5rem;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      background: rgba(248,250,252,0.7);
      margin: 1rem 0;
      transition: 0.2s;
    }
    .upload-area i { font-size:2rem; color:#4f6ef7; margin-bottom:0.5rem; }
    .upload-area .upload-title { font-weight:600; font-size:1rem; }
    .upload-area .upload-hint { font-size:0.8rem; color:#64748b; }
    .upload-area.drag-over { border-color:#4f6ef7; background:#eef2ff; }

    .file-item {
      background: white; border-radius:1rem; padding:0.8rem;
      margin-bottom:0.6rem; display:flex; align-items:center; gap:0.8rem;
      border:1px solid #e2e8f0; flex-wrap:wrap;
    }
    .file-icon { font-size:1.5rem; color:#4f6ef7; }
    .file-info { flex:1; min-width:140px; }
    .file-name { font-weight:600; font-size:0.9rem; }
    .progress-wrap { display:flex; align-items:center; gap:0.6rem; margin-top:0.2rem; }
    .progress-bar { width:80px; height:5px; background:#e2e8f0; border-radius:10px; overflow:hidden; }
    .progress-fill { height:100%; background:#4f6ef7; width:0%; transition:0.3s; }
    .status-text { font-size:0.7rem; color:#475569; }
    .file-actions { display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
    .file-actions select {
      padding:0.3rem 0.6rem; border-radius:0.6rem; border:1px solid #e2e8f0;
      font-size:0.75rem; background:white; appearance:none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%23475669" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
      background-repeat:no-repeat; background-position:right 0.4rem center; padding-right:1.4rem;
    }

    .modal {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.3); backdrop-filter:blur(4px); align-items:center;
      justify-content:center; z-index:1000;
    }
    .modal.active { display:flex; }
    .modal-content {
      background:white; border-radius:1.5rem; padding:1.5rem; max-width:600px;
      width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 30px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    .close-modal { float:right; cursor:pointer; font-size:1.4rem; color:#94a3b8; }
    .form-group { margin-bottom:1rem; text-align: left; }
    .form-group label { display:block; font-size:0.8rem; font-weight:600; margin-bottom:0.3rem; }
    .form-group input {
      width:100%; padding:0.6rem 1rem; border-radius:0.8rem; border:1px solid #e2e8f0;
    }
    .record-item {
      background:#f8fafc; border-radius:0.8rem; padding:0.7rem; margin-bottom:0.5rem;
      border:1px solid #e2e8f0; font-size:0.8rem; text-align: left;
    }
    .toast-notification {
      position:fixed; bottom:2rem; right:2rem; background:#1e293b; color:white;
      padding:0.8rem 1.5rem; border-radius:2rem; font-weight:500;
      box-shadow:0 15px 30px rgba(0,0,0,0.3); transform:translateY(100px);
      opacity:0; transition:0.3s; z-index:999;
    }
    .toast-notification.show { transform:translateY(0); opacity:1; }

    .qr-large-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .qr-large-wrapper {
      background: linear-gradient(135deg, #4f6ef7, #a855f7, #ec4899);
      padding: 6px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(79,110,247,0.4);
    }
    .qr-large-inner {
      background: white;
      border-radius: 16px;
      padding: 12px;
    }

    @media (max-width:640px) {
      .file-item { flex-direction:column; align-items:flex-start; }
      .file-actions { width:100%; justify-content:flex-end; }
      .top-bar { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- 顶部栏 -->
  <div class="card top-bar">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-language"></i></div>
      <div class="brand-text">
        <h1>灵译</h1>
        <span>文档翻译神器，账号登录查看使用记录</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <span id="loginStatus" style="font-size:0.85rem; color:#475569;"></span>
        <button class="btn btn-outline btn-sm" id="loginBtn"><i class="fas fa-user"></i> 登录</button>
        <button class="btn btn-outline btn-sm" id="historyBtn" style="display:none;"><i class="fas fa-history"></i> 记录</button>
        <button class="btn btn-outline btn-sm" id="adminBtn" style="display:none;"><i class="fas fa-crown"></i> 管理</button>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> 退出</button>
      </div>
      <div class="qr-section" id="qrSection">
        <div class="qr-code-wrapper">
          <div class="qr-code-inner" id="qrContainer"></div>
        </div>
        <span class="qr-text">扫码打开</span>
      </div>
    </div>
  </div>

  <!-- 上传与处理 -->
  <div class="card">
    <div class="upload-area" id="uploadTrigger">
      <i class="fas fa-cloud-upload-alt"></i>
      <div class="upload-title">点击或拖拽上传文件（可多选）</div>
      <div class="upload-hint">PDF · Word · TXT · 图片 (PNG/JPG)</div>
      <input type="file" id="fileInput" hidden multiple accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,image/png,image/jpeg">
    </div>
    <div id="processingList" style="margin-top:1rem;"></div>
  </div>

  <!-- 已完成列表 -->
  <div class="card">
    <div style="font-weight:600; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;">
      <i class="fas fa-check-circle" style="color:#10b981;"></i> 已完成的文档
    </div>
    <div id="completedList">
      <div style="color:#94a3b8; text-align:center; padding:2rem;">暂无完成的翻译文档</div>
    </div>
  </div>
</div>

<!-- 二维码放大模态框 -->
<div class="modal" id="qrZoomModal">
  <div class="modal-content" style="max-width:350px;">
    <span class="close-modal" id="closeQrZoom">&times;</span>
    <div class="qr-large-container">
      <div class="qr-large-wrapper">
        <div class="qr-large-inner" id="qrLargeContainer"></div>
      </div>
      <h3 style="font-weight:700; font-size:1.3rem; background:linear-gradient(135deg, #4f6ef7, #7b5cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">灵译</h3>
      <p style="font-size:0.8rem; color:#64748b;">扫描二维码打开应用</p>
    </div>
  </div>
</div>

<!-- 登录模态框 -->
<div class="modal" id="loginModal">
  <div class="modal-content" style="text-align:left;">
    <span class="close-modal" id="closeLoginModal">&times;</span>
    <h3 style="margin-bottom:1rem; text-align:center;"><i class="fas fa-sign-in-alt"></i> 账号登录</h3>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="loginUsername" placeholder="输入账号">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="输入密码">
    </div>
    <button class="btn btn-primary" id="doLoginBtn" style="width:100%;">登录</button>
    <p style="margin-top:0.8rem; font-size:0.75rem; color:#64748b; text-align:center;">
      没有账号？输入账号密码后将自动注册并登录。
    </p>
  </div>
</div>

<!-- 历史记录模态框 -->
<div class="modal" id="historyModal">
  <div class="modal-content" style="text-align:left;">
    <span class="close-modal" id="closeHistoryModal">&times;</span>
    <h3 style="margin-bottom:1rem;"><i class="fas fa-history"></i> 我的使用记录 (30天)</h3>
    <div id="historyContent" style="max-height:50vh; overflow-y:auto;"></div>
  </div>
</div>

<!-- 管理员模态框 -->
<div class="modal" id="adminModal">
  <div class="modal-content" style="max-width:700px; text-align:left;">
    <span class="close-modal" id="closeAdminModal">&times;</span>
    <h3 style="margin-bottom:1rem;"><i class="fas fa-crown"></i> 管理员面板</h3>
    <div id="adminContent" style="max-height:55vh; overflow-y:auto;"></div>
    <button class="btn btn-danger btn-sm" id="clearAllRecordsBtn" style="margin-top:1rem;">清除所有记录</button>
  </div>
</div>

<div class="toast-notification" id="toast"></div>

<!-- 依赖库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

<script>
  (function() {
    // ---------- 全局状态 ----------
    const state = {
      processingFiles: [],
      completedFiles: [],
      currentUser: null,
      records: [],
      nextId: 1,
    };

    // DOM
    const uploadTrigger = document.getElementById('uploadTrigger');
    const fileInput = document.getElementById('fileInput');
    const processingList = document.getElementById('processingList');
    const completedList = document.getElementById('completedList');
    const loginBtn = document.getElementById('loginBtn');
    const historyBtn = document.getElementById('historyBtn');
    const adminBtn = document.getElementById('adminBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginStatus = document.getElementById('loginStatus');
    const loginModal = document.getElementById('loginModal');
    const closeLoginModal = document.getElementById('closeLoginModal');
    const doLoginBtn = document.getElementById('doLoginBtn');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const historyModal = document.getElementById('historyModal');
    const closeHistoryModal = document.getElementById('closeHistoryModal');
    const historyContent = document.getElementById('historyContent');
    const adminModal = document.getElementById('adminModal');
    const closeAdminModal = document.getElementById('closeAdminModal');
    const adminContent = document.getElementById('adminContent');
    const clearAllRecordsBtn = document.getElementById('clearAllRecordsBtn');
    const toastEl = document.getElementById('toast');
    const qrSection = document.getElementById('qrSection');
    const qrZoomModal = document.getElementById('qrZoomModal');
    const closeQrZoom = document.getElementById('closeQrZoom');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 生成小二维码
    new QRCode(document.getElementById('qrContainer'), {
      text: window.location.href,
      width: 36, height: 36,
      colorDark: "#1e293b",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.L
    });

    // 点击二维码放大
    qrSection.addEventListener('click', () => {
      document.getElementById('qrLargeContainer').innerHTML = '';
      new QRCode(document.getElementById('qrLargeContainer'), {
        text: window.location.href,
        width: 200, height: 200,
        colorDark: "#1e293b",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      qrZoomModal.classList.add('active');
    });
    closeQrZoom.addEventListener('click', () => qrZoomModal.classList.remove('active'));
    qrZoomModal.addEventListener('click', (e) => { if (e.target === qrZoomModal) qrZoomModal.classList.remove('active'); });

    // ---------- 工具函数 ----------
    function showToast(msg, isError=false) {
      toastEl.textContent = msg;
      toastEl.style.background = isError ? '#dc2626' : '#1e293b';
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    function getFileIcon(name) {
      const ext = name.split('.').pop().toLowerCase();
      if (ext === 'pdf') return 'fa-file-pdf';
      if (ext === 'docx') return 'fa-file-word';
      if (ext === 'txt') return 'fa-file-alt';
      if (['png','jpg','jpeg'].includes(ext)) return 'fa-file-image';
      return 'fa-file';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---------- 本地存储 ----------
    function loadUsers() { return JSON.parse(localStorage.getItem('lingyi_users') || '{}'); }
    function saveUsers(users) { localStorage.setItem('lingyi_users', JSON.stringify(users)); }
    function loadAllRecords() { return JSON.parse(localStorage.getItem('lingyi_records') || '[]'); }
    function saveAllRecords(records) { localStorage.setItem('lingyi_records', JSON.stringify(records)); }

    function cleanOldRecords(records) {
      const now = Date.now();
      const thirtyDays = 30 * 24 * 60 * 60 * 1000;
      return records.filter(r => (now - r.timestamp) < thirtyDays);
    }

    function getUserRecords() {
      const all = loadAllRecords();
      const cleaned = cleanOldRecords(all);
      saveAllRecords(cleaned);
      if (!state.currentUser) return [];
      if (state.currentUser.isAdmin) return cleaned;
      return cleaned.filter(r => r.username === state.currentUser.username);
    }

    function addRecord(fileObj) {
      if (!state.currentUser) return;
      const records = loadAllRecords();
      records.push({
        id: Date.now(),
        username: state.currentUser.username,
        filename: fileObj.name,
        targetLang: fileObj.targetLang,
        outputFormat: fileObj.outputFormat,
        translatedText: fileObj.translatedText.substring(0, 200),
        timestamp: Date.now(),
      });
      saveAllRecords(cleanOldRecords(records));
      state.records = getUserRecords();
    }

    // ---------- 用户认证 ----------
    function login(username, password) {
      if (username === '' && password === 'A123666') {
        state.currentUser = { username: 'admin', isAdmin: true };
        updateLoginUI();
        showToast('管理员登录成功');
        return true;
      }
      if (!username.trim()) {
        showToast('账号不能为空', true);
        return false;
      }
      const users = loadUsers();
      if (users[username]) {
        if (users[username].password === password) {
          state.currentUser = { username, isAdmin: false };
          updateLoginUI();
          showToast(`欢迎回来，${username}`);
          return true;
        } else {
          showToast('密码错误', true);
          return false;
        }
      } else {
        users[username] = { password };
        saveUsers(users);
        state.currentUser = { username, isAdmin: false };
        updateLoginUI();
        showToast(`账号已创建并登录，${username}`);
        return true;
      }
    }

    function logout() {
      state.currentUser = null;
      state.completedFiles = [];
      updateLoginUI();
      updateUI();
      showToast('已退出登录，未登录状态下的已完成文档将不保留');
    }

    function updateLoginUI() {
      if (state.currentUser) {
        loginStatus.textContent = state.currentUser.isAdmin ? '管理员' : state.currentUser.username;
        loginBtn.style.display = 'none';
        historyBtn.style.display = 'inline-flex';
        logoutBtn.style.display = 'inline-flex';
        adminBtn.style.display = state.currentUser.isAdmin ? 'inline-flex' : 'none';
      } else {
        loginStatus.textContent = '';
        loginBtn.style.display = 'inline-flex';
        historyBtn.style.display = 'none';
        logoutBtn.style.display = 'none';
        adminBtn.style.display = 'none';
      }
    }

    // ---------- 渲染 ----------
    function renderProcessing() {
      if (state.processingFiles.length === 0) { processingList.innerHTML = ''; return; }
      processingList.innerHTML = state.processingFiles.map(f => {
        const progress = f.progress || 0;
        const statusMap = { 'extracting':'提取文本中...','translating':'翻译中...','generating':'生成文件中...','error':'处理失败','pending':'等待翻译' };
        const icon = f.status === 'error' ? 'fa-exclamation-circle' : (f.status === 'pending' ? 'fa-clock' : 'fa-spinner fa-pulse');
        return `<div class="file-item"><div class="file-icon"><i class="fas ${getFileIcon(f.name)}"></i></div><div class="file-info"><div class="file-name">${f.name}</div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div><span class="status-text"><i class="fas ${icon}"></i> ${statusMap[f.status]}</span></div></div><div class="file-actions"><select class="lang-select" data-id="${f.id}" ${f.status!=='pending'&&f.status!=='error'?'disabled':''}><option value="zh-CN" ${f.targetLang==='zh-CN'?'selected':''}>中文</option><option value="ja" ${f.targetLang==='ja'?'selected':''}>日本語</option><option value="ko" ${f.targetLang==='ko'?'selected':''}>한국어</option><option value="fr" ${f.targetLang==='fr'?'selected':''}>Français</option><option value="de" ${f.targetLang==='de'?'selected':''}>Deutsch</option><option value="es" ${f.targetLang==='es'?'selected':''}>Español</option><option value="zh-TW" ${f.targetLang==='zh-TW'?'selected':''}>繁体中文</option></select><select class="format-select" data-id="${f.id}" ${f.status!=='pending'&&f.status!=='error'?'disabled':''}><option value="pdf" ${f.outputFormat==='pdf'?'selected':''}>PDF</option><option value="docx" ${f.outputFormat==='docx'?'selected':''}>Word</option><option value="txt" ${f.outputFormat==='txt'?'selected':''}>TXT</option><option value="html" ${f.outputFormat==='html'?'selected':''}>HTML</option><option value="bilingual" ${f.outputFormat==='bilingual'?'selected':''}>双语HTML</option></select><button class="btn btn-primary btn-sm translate-btn" data-id="${f.id}" ${f.status==='extracting'||f.status==='translating'||f.status==='generating'?'disabled':''}><i class="fas fa-language"></i> 翻译</button></div></div>`;
      }).join('');
      document.querySelectorAll('.lang-select').forEach(s => s.addEventListener('change', e => { const f=state.processingFiles.find(f=>f.id===parseInt(s.dataset.id)); if(f) f.targetLang=s.value; }));
      document.querySelectorAll('.format-select').forEach(s => s.addEventListener('change', e => { const f=state.processingFiles.find(f=>f.id===parseInt(s.dataset.id)); if(f) f.outputFormat=s.value; }));
      document.querySelectorAll('.translate-btn').forEach(b => b.addEventListener('click', () => { const f=state.processingFiles.find(f=>f.id===parseInt(b.dataset.id)); if(f) translateSingleFile(f); }));
    }

    function renderCompleted() {
      if (state.completedFiles.length === 0) { completedList.innerHTML='<div style="color:#94a3b8;text-align:center;padding:2rem;">暂无完成的翻译文档</div>'; return; }
      completedList.innerHTML = state.completedFiles.map(f => `<div class="file-item"><div class="file-icon"><i class="fas fa-check-circle" style="color:#10b981;"></i></div><div class="file-info"><div class="file-name">${f.name}</div><div style="font-size:0.7rem;color:#64748b;">翻译完成 · ${f.outputFilename}</div></div><div class="file-actions"><button class="btn btn-outline btn-sm view-btn" data-id="${f.id}"><i class="fas fa-eye"></i> 查看</button><button class="btn btn-outline btn-sm download-btn" data-id="${f.id}"><i class="fas fa-download"></i> 下载</button></div></div>`).join('');
      document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => { const f=state.completedFiles.find(f=>f.id===parseInt(b.dataset.id)); if(f) showTextModal(f.name, f.translatedText); }));
      document.querySelectorAll('.download-btn').forEach(b => b.addEventListener('click', () => { const f=state.completedFiles.find(f=>f.id===parseInt(b.dataset.id)); if(f&&f.outputBlob){ downloadBlob(f.outputBlob, f.outputFilename); showToast(`下载 ${f.outputFilename}`); } }));
    }

    function showTextModal(title, text) {
      const modal = document.createElement('div'); modal.className='modal active';
      modal.innerHTML = `<div class="modal-content" style="text-align:left;"><span class="close-modal" onclick="this.closest('.modal').remove()">&times;</span><h3>${title}</h3><div style="max-height:60vh;overflow-y:auto;white-space:pre-wrap;margin-top:1rem;">${escapeHtml(text)}</div></div>`;
      document.body.appendChild(modal);
      modal.addEventListener('click', e => { if(e.target===modal) modal.remove(); });
    }

    function updateUI() { renderProcessing(); renderCompleted(); }

    function addFiles(fileList) {
      for(const file of fileList){
        const ext = file.name.split('.').pop().toLowerCase();
        if(!['pdf','docx','txt','png','jpg','jpeg'].includes(ext)){ showToast(`不支持的类型: ${file.name}`, true); continue; }
        state.processingFiles.push({ id: state.nextId++, file, name: file.name, type: ext, extractedText:'', translatedText:'', progress:0, status:'pending', targetLang:'zh-CN', outputFormat:'pdf' });
      }
      updateUI();
    }

    async function translateSingleFile(fileObj) {
      fileObj.status='extracting'; fileObj.progress=0; updateUI();
      try{
        await extractText(fileObj);
        if(!fileObj.extractedText) throw new Error('未提取到文本');
        fileObj.status='translating'; fileObj.progress=0; updateUI();
        fileObj.translatedText = await translateOnline(fileObj.extractedText, fileObj.targetLang, fileObj);
        fileObj.status='generating'; fileObj.progress=0; updateUI();
        const { blob, filename } = await generateOutput(fileObj, fileObj.outputFormat);
        state.processingFiles = state.processingFiles.filter(f => f.id !== fileObj.id);
        state.completedFiles.push({ id: fileObj.id, name: fileObj.name, outputBlob: blob, outputFilename: filename, translatedText: fileObj.translatedText });
        addRecord(fileObj);
        showToast(`${fileObj.name} 翻译完成`);
      }catch(err){ fileObj.status='error'; showToast(`${fileObj.name} 处理失败: ${err.message}`, true); }
      updateUI();
    }

    async function extractText(fileObj) {
      switch(fileObj.type){
        case 'pdf': return await extractPDF(fileObj);
        case 'docx': return await extractDocx(fileObj);
        case 'txt': fileObj.extractedText=await fileObj.file.text(); fileObj.progress=100; return fileObj.extractedText;
        case 'png': case 'jpg': case 'jpeg': return await extractImage(fileObj);
        default: throw new Error('不支持的类型');
      }
    }
    async function extractPDF(fileObj){ const arrayBuf=await fileObj.file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise; let text=''; for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const content=await page.getTextContent(); text+=content.items.map(item=>item.str).join(' ')+'\n'; fileObj.progress=Math.round((i/pdf.numPages)*90)+5; updateUI(); } fileObj.extractedText=text.replace(/\s{2,}/g,' ').trim(); fileObj.progress=100; return fileObj.extractedText; }
    async function extractDocx(fileObj){ const arrayBuf=await fileObj.file.arrayBuffer(); const result=await mammoth.extractRawText({arrayBuffer:arrayBuf}); fileObj.extractedText=result.value.trim(); fileObj.progress=100; return fileObj.extractedText; }
    async function extractImage(fileObj){ const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'){fileObj.progress=Math.round(m.progress*100); updateUI();}}}); const {data:{text}}=await worker.recognize(fileObj.file); await worker.terminate(); fileObj.extractedText=text.trim(); fileObj.progress=100; return fileObj.extractedText; }

    async function translateOnline(text, targetLang, fileObj) {
      const maxLen=400; const chunks=splitText(text,maxLen); let result=[];
      for(let i=0;i<chunks.length;i++){
        const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunks[i])}&langpair=en|${targetLang}`;
        const res=await fetch(url); if(!res.ok) throw new Error('翻译服务响应异常');
        const data=await res.json();
        if(data.responseStatus===200) result.push(data.responseData.translatedText);
        else throw new Error(data.responseDetails||'翻译失败');
        fileObj.progress=Math.round(((i+1)/chunks.length)*100); updateUI();
        if(i<chunks.length-1) await new Promise(r=>setTimeout(r,200));
      }
      return result.join('\n\n');
    }
    function splitText(text,max){ const sentences=text.match(/[^.!?\n]+[.!?]*\s*/g)||[text]; const chunks=[]; let cur=''; for(const s of sentences){ if((cur+s).length<=max) cur+=s; else{ if(cur) chunks.push(cur.trim()); cur=s; } } if(cur) chunks.push(cur.trim()); return chunks.length?chunks:[text]; }

    async function generateOutput(fileObj, format){
      const name=fileObj.name.replace(/\.[^.]+$/,'');
      switch(format){
        case 'pdf': return await generatePDF(fileObj.translatedText, name);
        case 'docx': return await generateDOCX(fileObj.translatedText, name);
        case 'txt': return generateTXT(fileObj.translatedText, name);
        case 'html': return generateHTML(fileObj.translatedText, name);
        case 'bilingual': return generateBilingualHTML(fileObj.extractedText, fileObj.translatedText, name);
        default: return generateTXT(fileObj.translatedText, name);
      }
    }
    async function generatePDF(text,name){ const {jsPDF}=window.jspdf; const doc=new jsPDF(); const maxWidth=doc.internal.pageSize.getWidth()-40; doc.setFontSize(12); const lines=doc.splitTextToSize(text,maxWidth); doc.text(lines,20,20); return {blob:doc.output('blob'),filename:`${name}_翻译.pdf`}; }
    async function generateDOCX(text,name){ const {Document,Packer,Paragraph,TextRun}=docx; const paragraphs=text.split('\n\n').filter(p=>p.trim()).map(p=>new Paragraph({children:[new TextRun({text:p.trim(),size:24})],spacing:{after:200},indent:{firstLine:480}})); const doc=new Document({sections:[{children:paragraphs}]}); const blob=await Packer.toBlob(doc); return {blob,filename:`${name}_翻译.docx`}; }
    function generateTXT(text,name){ return {blob:new Blob(['\uFEFF'+text],{type:'text/plain;charset=utf-8'}),filename:`${name}_翻译.txt`}; }
    function generateHTML(text,name){ const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>翻译-${name}</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;line-height:1.8;}p{text-indent:2em;}</style></head><body><h1>翻译结果</h1>${text.split('\n\n').map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}</body></html>`; return {blob:new Blob(['\uFEFF'+html],{type:'text/html;charset=utf-8'}),filename:`${name}_翻译.html`}; }
    function generateBilingualHTML(original,translated,name){ const origParas=original.split('\n\n').filter(p=>p.trim()); const transParas=translated.split('\n\n').filter(p=>p.trim()); let rows=''; for(let i=0;i<Math.max(origParas.length,transParas.length);i++){ rows+=`<tr><td style="width:50%;">${(origParas[i]||'').replace(/\n/g,'<br>')}</td><td style="width:50%;">${(transParas[i]||'').replace(/\n/g,'<br>')}</td></tr>`; } const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>双语-${name}</title><style>body{font-family:sans-serif;max-width:1000px;margin:2em auto;}table{width:100%;border-collapse:collapse;}td{padding:8px;border:1px solid #ddd;vertical-align:top;}</style></head><body><h1>双语对照</h1><table>${rows}</table></body></html>`; return {blob:new Blob(['\uFEFF'+html],{type:'text/html;charset=utf-8'}),filename:`${name}_双语.html`}; }
    function downloadBlob(blob,filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000); }

    // 事件绑定
    uploadTrigger.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',e=>{ if(e.target.files.length){ addFiles(e.target.files); fileInput.value=''; } });
    uploadTrigger.addEventListener('dragover',e=>{ e.preventDefault(); uploadTrigger.classList.add('drag-over'); });
    uploadTrigger.addEventListener('dragleave',()=>uploadTrigger.classList.remove('drag-over'));
    uploadTrigger.addEventListener('drop',e=>{ e.preventDefault(); uploadTrigger.classList.remove('drag-over'); if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

    loginBtn.addEventListener('click',()=>loginModal.classList.add('active'));
    closeLoginModal.addEventListener('click',()=>loginModal.classList.remove('active'));
    doLoginBtn.addEventListener('click',()=>{
      const username=loginUsername.value.trim(); const password=loginPassword.value.trim();
      if(login(username,password)){ loginModal.classList.remove('active'); loginUsername.value=''; loginPassword.value=''; }
    });
    historyBtn.addEventListener('click',()=>{
      state.records=getUserRecords();
      historyContent.innerHTML=state.records.length===0?'<div style="color:#94a3b8;padding:1rem;">暂无使用记录</div>':state.records.map(r=>`<div class="record-item"><strong>${r.filename}</strong> → ${r.targetLang} (${r.outputFormat})<br><small>${new Date(r.timestamp).toLocaleString()} | ${r.translatedText.substring(0,60)}...</small></div>`).join('')+'<p style="font-size:0.7rem;color:#ef4444;margin-top:0.5rem;">⚠️ 记录仅保存30天，请及时下载文件。</p>';
      historyModal.classList.add('active');
    });
    closeHistoryModal.addEventListener('click',()=>historyModal.classList.remove('active'));
    adminBtn.addEventListener('click',()=>{
      if(!state.currentUser?.isAdmin) return;
      const all=loadAllRecords(); const cleaned=cleanOldRecords(all); saveAllRecords(cleaned);
      adminContent.innerHTML=cleaned.length===0?'<div>暂无任何用户记录</div>':cleaned.map(r=>`<div class="record-item"><strong>${r.username}</strong> | ${r.filename} → ${r.targetLang} (${r.outputFormat})<br><small>${new Date(r.timestamp).toLocaleString()}</small></div>`).join('');
      adminModal.classList.add('active');
    });
    closeAdminModal.addEventListener('click',()=>adminModal.classList.remove('active'));
    clearAllRecordsBtn.addEventListener('click',()=>{ if(confirm('确定删除所有用户的使用记录吗？')){ localStorage.removeItem('lingyi_records'); showToast('已清除所有记录'); adminModal.classList.remove('active'); } });
    logoutBtn.addEventListener('click',logout);

    window.addEventListener('click',e=>{ if(e.target===loginModal) loginModal.classList.remove('active'); if(e.target===historyModal) historyModal.classList.remove('active'); if(e.target===adminModal) adminModal.classList.remove('active'); });

    updateUI(); updateLoginUI();
    showToast('提示：未登录也可使用，但记录不保留。登录后记录保存30天。');
  })();
</script>
</body>
</html>
