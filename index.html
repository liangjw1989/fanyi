<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>灵译 · 翻译与转换神器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f0f4fd 0%, #e6ebf7 100%);
      min-height: 100vh; display: flex; justify-content: center;
      color: #1e293b; padding: 1rem;
    }
    .app-wrapper { width:100%; max-width:1200px; display:flex; flex-direction:column; gap:1.5rem; }
    .card {
      background: rgba(255,255,255,0.75); backdrop-filter: blur(20px);
      border-radius: 2rem; padding: 1.5rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
    .brand { display:flex; align-items:center; gap:0.75rem; }
    .brand-icon {
      background: linear-gradient(135deg, #4f6ef7, #7b5cff);
      width:48px; height:48px; border-radius:18px;
      display:flex; align-items:center; justify-content:center;
      color:white; font-size:24px; box-shadow:0 10px 20px -5px rgba(79,110,247,0.4);
    }
    .brand-text h1 {
      font-weight:700; font-size:1.8rem;
      background: linear-gradient(to right, #1e293b, #334155);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-text span { font-size:0.8rem; color:#64748b; font-weight:500; }

    .qr-section { display:flex; align-items:center; gap:0.8rem; cursor:pointer; transition:0.2s; }
    .qr-section:hover { transform:scale(1.05); }
    .qr-code-wrapper {
      width:40px; height:40px; border-radius:12px; padding:2px;
      background: linear-gradient(135deg, #4f6ef7, #a855f7, #ec4899);
      box-shadow:0 4px 12px rgba(79,110,247,0.3);
      display:flex; align-items:center; justify-content:center;
    }
    .qr-code-inner { width:36px; height:36px; border-radius:10px; background:white; overflow:hidden; }

    .btn {
      padding:0.5rem 1.2rem; border-radius:2rem; font-weight:600; border:none;
      cursor:pointer; display:inline-flex; align-items:center; gap:0.5rem;
      transition:0.2s; font-size:0.85rem;
    }
    .btn-primary { background:#4f6ef7; color:white; }
    .btn-primary:hover:not(:disabled) { background:#3b54d4; }
    .btn-outline { background:white; border:1.5px solid #e2e8f0; color:#334155; }
    .btn-outline:hover { background:#f8fafc; border-color:#4f6ef7; }
    .btn-danger { background:#ef4444; color:white; }
    .btn-sm { padding:0.3rem 0.8rem; font-size:0.75rem; }

    .tabs { display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .tab-btn {
      background:white; border:1.5px solid #e2e8f0; color:#64748b;
      padding:0.5rem 1.5rem; border-radius:2rem; font-weight:600;
      cursor:pointer; transition:0.2s;
    }
    .tab-btn.active { background:#4f6ef7; color:white; border-color:#4f6ef7; }

    .upload-area {
      border:2px dashed #cbd5e1; border-radius:1.5rem; padding:2rem;
      text-align:center; cursor:pointer; background:rgba(248,250,252,0.7);
      margin:1rem 0; transition:0.2s;
    }
    .upload-area i { font-size:2rem; color:#4f6ef7; margin-bottom:0.5rem; }
    .upload-area.drag-over { border-color:#4f6ef7; background:#eef2ff; }
    .upload-hint { font-size:0.8rem; color:#64748b; }

    .file-item {
      background: white; border-radius:1rem; padding:0.8rem;
      margin-bottom:0.6rem; display:flex; align-items:center; gap:0.8rem;
      border:1px solid #e2e8f0; flex-wrap:wrap;
    }
    .file-icon { font-size:1.5rem; color:#4f6ef7; }
    .file-info { flex:1; min-width:140px; }
    .file-name { font-weight:600; font-size:0.9rem; }
    .progress-bar { width:80px; height:5px; background:#e2e8f0; border-radius:10px; overflow:hidden; }
    .progress-fill { height:100%; background:#4f6ef7; width:0%; transition:0.3s; }
    .file-actions { display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
    select {
      padding:0.3rem 0.6rem; border-radius:0.6rem; border:1px solid #e2e8f0;
      font-size:0.75rem; background:white; appearance:none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%23475669" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
      background-repeat:no-repeat; background-position:right 0.4rem center; padding-right:1.4rem;
    }

    .modal {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.3); backdrop-filter:blur(4px);
      align-items:center; justify-content:center; z-index:1000;
    }
    .modal.active { display:flex; }
    .modal-content {
      background:white; border-radius:1.5rem; padding:1.5rem; max-width:600px;
      width:90%; max-height:80vh; overflow-y:auto;
      box-shadow:0 30px 50px rgba(0,0,0,0.3);
      text-align: left;
    }
    .close-modal { float:right; cursor:pointer; font-size:1.4rem; color:#94a3b8; }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:0.8rem; font-weight:600; margin-bottom:0.3rem; }
    .form-group input {
      width:100%; padding:0.6rem 1rem; border-radius:0.8rem; border:1px solid #e2e8f0;
    }
    .record-item {
      background:#f8fafc; border-radius:0.8rem; padding:0.7rem; margin-bottom:0.5rem;
      border:1px solid #e2e8f0; font-size:0.8rem;
    }
    .toast-notification {
      position:fixed; bottom:2rem; right:2rem; background:#1e293b; color:white;
      padding:0.8rem 1.5rem; border-radius:2rem; font-weight:500;
      box-shadow:0 15px 30px rgba(0,0,0,0.3); transform:translateY(100px);
      opacity:0; transition:0.3s; z-index:999;
    }
    .toast-notification.show { transform:translateY(0); opacity:1; }

    .qr-large-container { display:flex; flex-direction:column; align-items:center; gap:1rem; }
    .qr-large-wrapper {
      background: linear-gradient(135deg, #4f6ef7, #a855f7, #ec4899);
      padding:6px; border-radius:20px; box-shadow:0 10px 30px rgba(79,110,247,0.4);
    }
    .qr-large-inner { background:white; border-radius:16px; padding:12px; }

    .footer-hint {
      text-align: center; font-size:0.75rem; color:#64748b;
      background: rgba(255,255,255,0.6); padding:0.6rem; border-radius:1.5rem;
      backdrop-filter: blur(10px); margin-top:0.5rem;
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- 顶部 -->
  <div class="card top-bar">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-language"></i></div>
      <div class="brand-text">
        <h1>灵译</h1>
        <span>文档翻译与格式转换神器</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <span id="loginStatus" style="font-size:0.85rem; color:#475569;"></span>
        <button class="btn btn-outline btn-sm" id="loginBtn"><i class="fas fa-user"></i> 登录</button>
        <button class="btn btn-outline btn-sm" id="historyBtn" style="display:none;"><i class="fas fa-history"></i> 记录</button>
        <button class="btn btn-outline btn-sm" id="adminBtn" style="display:none;"><i class="fas fa-crown"></i> 管理</button>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> 退出</button>
      </div>
      <div class="qr-section" id="qrSection">
        <div class="qr-code-wrapper"><div class="qr-code-inner" id="qrContainer"></div></div>
        <span class="qr-text">扫码打开</span>
      </div>
    </div>
  </div>

  <!-- 功能标签 -->
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="translateTabBtn">🌐 文档翻译</button>
      <button class="tab-btn" id="convertTabBtn">🔄 格式转换</button>
    </div>

    <div id="translateModule">
      <div class="upload-area" id="translateUpload">
        <i class="fas fa-cloud-upload-alt"></i>
        <div class="upload-title">点击上传需翻译的文件</div>
        <div class="upload-hint">PDF · Word · TXT · 图片</div>
        <input type="file" id="translateFileInput" hidden multiple accept="*/*">
      </div>
      <div id="translateFileList"></div>
    </div>

    <div id="convertModule" style="display:none;">
      <div class="upload-area" id="convertUpload">
        <i class="fas fa-exchange-alt"></i>
        <div class="upload-title">点击上传需转换格式的文件</div>
        <div class="upload-hint">支持 PDF · Word · TXT · 图片（转换为其他格式）</div>
        <input type="file" id="convertFileInput" hidden multiple accept="*/*">
      </div>
      <div id="convertFileList"></div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:600; margin-bottom:1rem;"><i class="fas fa-check-circle" style="color:#10b981;"></i> 已完成的文档</div>
    <div id="completedList"><div style="color:#94a3b8; text-align:center; padding:2rem;">暂无完成的文档</div></div>
  </div>

  <div class="footer-hint">🔐 登录后使用完整功能</div>
</div>

<!-- 二维码放大模态框 -->
<div class="modal" id="qrZoomModal">
  <div class="modal-content" style="max-width:350px;">
    <span class="close-modal" id="closeQrZoom">&times;</span>
    <div class="qr-large-container">
      <div class="qr-large-wrapper"><div class="qr-large-inner" id="qrLargeContainer"></div></div>
      <h3 style="font-weight:700; font-size:1.3rem; background:linear-gradient(135deg, #4f6ef7, #7b5cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">灵译</h3>
      <p style="font-size:0.8rem; color:#64748b;">扫描二维码打开应用</p>
    </div>
  </div>
</div>

<!-- 登录模态框 -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <span class="close-modal" id="closeLoginModal">&times;</span>
    <h3 style="margin-bottom:1rem; text-align:center;"><i class="fas fa-sign-in-alt"></i> 账号登录</h3>
    <div class="form-group"><label>账号</label><input type="text" id="loginUsername" placeholder="输入账号"></div>
    <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="输入密码"></div>
    <button class="btn btn-primary" id="doLoginBtn" style="width:100%;">登录</button>
    <p style="margin-top:0.8rem; font-size:0.75rem; color:#64748b; text-align:center;">没有账号？输入账号密码后将自动注册并登录。</p>
  </div>
</div>

<!-- 历史记录模态框 -->
<div class="modal" id="historyModal">
  <div class="modal-content">
    <span class="close-modal" id="closeHistoryModal">&times;</span>
    <h3 style="margin-bottom:1rem;"><i class="fas fa-history"></i> 我的使用记录 (30天)</h3>
    <div id="historyContent" style="max-height:50vh; overflow-y:auto;"></div>
  </div>
</div>

<!-- 管理员模态框 -->
<div class="modal" id="adminModal">
  <div class="modal-content" style="max-width:700px;">
    <span class="close-modal" id="closeAdminModal">&times;</span>
    <h3 style="margin-bottom:1rem;"><i class="fas fa-crown"></i> 管理员面板</h3>
    <div id="adminContent" style="max-height:55vh; overflow-y:auto;"></div>
    <button class="btn btn-danger btn-sm" id="clearAllRecordsBtn" style="margin-top:1rem;">清除所有记录</button>
  </div>
</div>

<div class="toast-notification" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

<script>
  (() => {
    // ==================== 配置 ====================
    // ⚠️ 请将此处替换为你腾讯云函数实际生成的 URL 地址
    const API_PROXY_URL = 'https://1430386389-cd8v5r6ng0.ap-beijing.tencentscf.com';

    // ==================== 全局状态 ====================
    const state = {
      translateFiles: [],
      convertFiles: [],
      completed: [],
      currentUser: null,
      nextId: 1,
    };

    // DOM 元素
    const translateUpload = document.getElementById('translateUpload');
    const translateFileInput = document.getElementById('translateFileInput');
    const translateFileList = document.getElementById('translateFileList');
    const convertUpload = document.getElementById('convertUpload');
    const convertFileInput = document.getElementById('convertFileInput');
    const convertFileList = document.getElementById('convertFileList');
    const completedList = document.getElementById('completedList');
    const loginBtn = document.getElementById('loginBtn');
    const historyBtn = document.getElementById('historyBtn');
    const adminBtn = document.getElementById('adminBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginStatus = document.getElementById('loginStatus');
    const translateTabBtn = document.getElementById('translateTabBtn');
    const convertTabBtn = document.getElementById('convertTabBtn');
    const translateModule = document.getElementById('translateModule');
    const convertModule = document.getElementById('convertModule');
    const toast = document.getElementById('toast');
    const qrSection = document.getElementById('qrSection');
    const qrZoomModal = document.getElementById('qrZoomModal');
    const closeQrZoom = document.getElementById('closeQrZoom');
    const loginModal = document.getElementById('loginModal');
    const closeLoginModal = document.getElementById('closeLoginModal');
    const doLoginBtn = document.getElementById('doLoginBtn');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const historyModal = document.getElementById('historyModal');
    const closeHistoryModal = document.getElementById('closeHistoryModal');
    const historyContent = document.getElementById('historyContent');
    const adminModal = document.getElementById('adminModal');
    const closeAdminModal = document.getElementById('closeAdminModal');
    const adminContent = document.getElementById('adminContent');
    const clearAllRecordsBtn = document.getElementById('clearAllRecordsBtn');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 二维码初始化
    new QRCode(document.getElementById('qrContainer'), {
      text: window.location.href, width:36, height:36,
      colorDark:"#1e293b", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.L
    });
    qrSection.addEventListener('click', () => {
      document.getElementById('qrLargeContainer').innerHTML = '';
      new QRCode(document.getElementById('qrLargeContainer'), {
        text: window.location.href, width:200, height:200,
        colorDark:"#1e293b", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.H
      });
      qrZoomModal.classList.add('active');
    });
    closeQrZoom.addEventListener('click', () => qrZoomModal.classList.remove('active'));
    qrZoomModal.addEventListener('click', (e) => { if (e.target === qrZoomModal) qrZoomModal.classList.remove('active'); });

    // 标签切换
    translateTabBtn.addEventListener('click', () => {
      translateTabBtn.classList.add('active'); convertTabBtn.classList.remove('active');
      translateModule.style.display = 'block'; convertModule.style.display = 'none';
    });
    convertTabBtn.addEventListener('click', () => {
      convertTabBtn.classList.add('active'); translateTabBtn.classList.remove('active');
      translateModule.style.display = 'none'; convertModule.style.display = 'block';
    });

    // 上传监听
    translateUpload.addEventListener('click', () => translateFileInput.click());
    translateFileInput.addEventListener('change', e => { if(e.target.files.length){ addFiles(e.target.files, 'translate'); translateFileInput.value=''; } });
    convertUpload.addEventListener('click', () => convertFileInput.click());
    convertFileInput.addEventListener('change', e => { if(e.target.files.length){ addFiles(e.target.files, 'convert'); convertFileInput.value=''; } });

    [translateUpload, convertUpload].forEach(area => {
      area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('drag-over'); });
      area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
      area.addEventListener('drop', e => {
        e.preventDefault(); area.classList.remove('drag-over');
        const type = area.id === 'translateUpload' ? 'translate' : 'convert';
        if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files, type);
      });
    });

    // ==================== 用户系统 ====================
    function loadUsers() { return JSON.parse(localStorage.getItem('lingyi_users') || '{}'); }
    function saveUsers(users) { localStorage.setItem('lingyi_users', JSON.stringify(users)); }
    function loadAllRecords() { return JSON.parse(localStorage.getItem('lingyi_records') || '[]'); }
    function saveAllRecords(records) { localStorage.setItem('lingyi_records', JSON.stringify(records)); }
    function cleanOldRecords(records) {
      const thirtyDays = 30 * 24 * 60 * 60 * 1000;
      return records.filter(r => (Date.now() - r.timestamp) < thirtyDays);
    }
    function addRecord(fileObj) {
      if (!state.currentUser) return;
      const records = loadAllRecords();
      records.push({
        id: Date.now(), username: state.currentUser.username, filename: fileObj.name,
        targetLang: fileObj.targetLang || 'N/A', outputFormat: fileObj.fmt,
        timestamp: Date.now(),
      });
      saveAllRecords(cleanOldRecords(records));
    }

    function login(username, password) {
      if (username === '' && password === 'A123666') {
        state.currentUser = { username: 'admin', isAdmin: true };
        updateLoginUI(); showToast('管理员登录成功'); return true;
      }
      if (!username.trim()) { showToast('账号不能为空', true); return false; }
      const users = loadUsers();
      if (users[username]) {
        if (users[username].password === password) {
          state.currentUser = { username, isAdmin: false };
          updateLoginUI(); showToast(`欢迎回来，${username}`); return true;
        } else { showToast('密码错误', true); return false; }
      } else {
        users[username] = { password }; saveUsers(users);
        state.currentUser = { username, isAdmin: false };
        updateLoginUI(); showToast(`账号已创建并登录，${username}`); return true;
      }
    }

    function logout() {
      state.currentUser = null; state.completed = [];
      updateLoginUI(); renderAll(); showToast('已退出登录');
    }

    function updateLoginUI() {
      if (state.currentUser) {
        loginStatus.textContent = state.currentUser.isAdmin ? '管理员' : state.currentUser.username;
        loginBtn.style.display = 'none';
        historyBtn.style.display = 'inline-flex';
        logoutBtn.style.display = 'inline-flex';
        adminBtn.style.display = state.currentUser.isAdmin ? 'inline-flex' : 'none';
      } else {
        loginStatus.textContent = '';
        loginBtn.style.display = 'inline-flex';
        historyBtn.style.display = 'none';
        logoutBtn.style.display = 'none';
        adminBtn.style.display = 'none';
      }
    }

    loginBtn.addEventListener('click', () => loginModal.classList.add('active'));
    closeLoginModal.addEventListener('click', () => loginModal.classList.remove('active'));
    doLoginBtn.addEventListener('click', () => {
      const u = loginUsername.value.trim(), p = loginPassword.value.trim();
      if (login(u, p)) { loginModal.classList.remove('active'); loginUsername.value=''; loginPassword.value=''; }
    });
    historyBtn.addEventListener('click', () => {
      const records = cleanOldRecords(loadAllRecords().filter(r => state.currentUser.isAdmin || r.username === state.currentUser.username));
      historyContent.innerHTML = records.length === 0 ? '<div style="color:#94a3b8;padding:1rem;">暂无使用记录</div>' :
        records.map(r => `<div class="record-item"><strong>${r.filename}</strong><br><small>${new Date(r.timestamp).toLocaleString()} | 格式: ${r.outputFormat}</small></div>`).join('') +
        '<p style="font-size:0.7rem;color:#ef4444;margin-top:0.5rem;">⚠️ 记录仅保存30天，请及时下载文件。</p>';
      historyModal.classList.add('active');
    });
    closeHistoryModal.addEventListener('click', () => historyModal.classList.remove('active'));
    adminBtn.addEventListener('click', () => {
      const records = cleanOldRecords(loadAllRecords());
      adminContent.innerHTML = records.length === 0 ? '<div>暂无任何用户记录</div>' :
        records.map(r => `<div class="record-item"><strong>${r.username}</strong> | ${r.filename}<br><small>${new Date(r.timestamp).toLocaleString()}</small></div>`).join('');
      adminModal.classList.add('active');
    });
    closeAdminModal.addEventListener('click', () => adminModal.classList.remove('active'));
    clearAllRecordsBtn.addEventListener('click', () => {
      if (confirm('确定删除所有用户的使用记录吗？')) { localStorage.removeItem('lingyi_records'); showToast('已清除所有记录'); adminModal.classList.remove('active'); }
    });
    logoutBtn.addEventListener('click', logout);

    window.addEventListener('click', e => {
      if (e.target === loginModal) loginModal.classList.remove('active');
      if (e.target === historyModal) historyModal.classList.remove('active');
      if (e.target === adminModal) adminModal.classList.remove('active');
    });

    // ==================== 文件处理 ====================
    function addFiles(files, type) {
      for (const file of files) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (type === 'translate' && !['pdf','docx','doc','txt','png','jpg','jpeg'].includes(ext)) {
          showToast(`翻译不支持: ${file.name}`, true); continue;
        }
        if (type === 'convert' && !['pdf','docx','doc','txt','png','jpg','jpeg'].includes(ext)) {
          showToast(`转换不支持: ${file.name}`, true); continue;
        }
        const fileObj = {
          id: state.nextId++, file, name: file.name, ext,
          type, status: 'pending', progress: 0,
          targetLang: 'zh-CN',
          fmt: type === 'translate' ? 'pdf' : (ext === 'pdf' ? 'docx' : ext === 'docx' ? 'pdf' : 'txt'),
          extractedText: '', translatedText: ''
        };
        if (type === 'translate') state.translateFiles.push(fileObj);
        else state.convertFiles.push(fileObj);
      }
      renderAll();
    }

    function renderAll() {
      translateFileList.innerHTML = state.translateFiles.map(f => renderFileItem(f, 'translate')).join('');
      convertFileList.innerHTML = state.convertFiles.map(f => renderFileItem(f, 'convert')).join('');
      completedList.innerHTML = state.completed.map(f => `
        <div class="file-item">
          <i class="fas fa-check-circle" style="color:#10b981;"></i>
          <div class="file-info"><div class="file-name">${f.name}</div><small>${f.filename}</small></div>
          <div class="file-actions">
            <button class="btn btn-outline btn-sm view-btn" data-text="${escapeHtml(f.translatedText || f.extractedText)}">查看</button>
            <button class="btn btn-outline btn-sm copy-btn" data-text="${escapeHtml(f.translatedText || f.extractedText)}">复制</button>
            <button class="btn btn-outline btn-sm download-btn" data-url="${f.blobUrl}" data-filename="${f.filename}">下载</button>
          </div>
        </div>
      `).join('') || '<div style="color:#94a3b8; text-align:center; padding:2rem;">暂无完成的文档</div>';
      bindEvents();
    }

    function renderFileItem(f, type) {
      const langSelect = type === 'translate' ? `<select class="lang-select" data-id="${f.id}"><option value="zh-CN" ${f.targetLang==='zh-CN'?'selected':''}>中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option></select>` : '';
      const targetFormats = type === 'translate' ? ['pdf','docx','txt','html','bilingual'] : ['pdf','docx','txt'];
      const formatSelect = `<select class="fmt-select" data-id="${f.id}">${targetFormats.map(fmt => `<option value="${fmt}" ${f.fmt===fmt?'selected':''}>${fmt.toUpperCase()}</option>`).join('')}</select>`;
      const actionBtn = `<button class="btn btn-primary btn-sm process-btn" data-id="${f.id}">${type === 'translate' ? '翻译' : '转换'}</button>`;
      // 👇 新增：删除按钮
      const deleteBtn = `<button class="btn btn-danger btn-sm delete-btn" data-id="${f.id}"><i class="fas fa-trash"></i></button>`;
      return `
        <div class="file-item">
          <i class="fas fa-file"></i>
          <div class="file-info">
            <div class="file-name">${f.name}</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${f.progress}%"></div></div>
            <small>${f.status === 'error' ? '失败' : f.status === 'done' ? '完成' : '等待'}</small>
          </div>
          <div class="file-actions">${langSelect}${formatSelect}${actionBtn}${deleteBtn}</div>
        </div>`;
    }

    function bindEvents() {
      document.querySelectorAll('.lang-select').forEach(s => s.addEventListener('change', e => {
        const f = findFile(parseInt(s.dataset.id)); if(f) f.targetLang = s.value;
      }));
      document.querySelectorAll('.fmt-select').forEach(s => s.addEventListener('change', e => {
        const f = findFile(parseInt(s.dataset.id)); if(f) f.fmt = s.value;
      }));
      document.querySelectorAll('.process-btn').forEach(b => b.addEventListener('click', () => {
        const f = findFile(parseInt(b.dataset.id)); if(f) processFile(f);
      }));
      // 👇 新增：删除事件绑定
      document.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', () => {
        const id = parseInt(b.dataset.id);
        state.translateFiles = state.translateFiles.filter(f => f.id !== id);
        state.convertFiles = state.convertFiles.filter(f => f.id !== id);
        renderAll();
      }));
      document.querySelectorAll('.download-btn').forEach(b => b.addEventListener('click', () => {
        const a = document.createElement('a'); a.href = b.dataset.url; a.download = b.dataset.filename; a.click();
      }));
      document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => {
        const w = window.open('', '_blank'); w.document.write(`<pre style="white-space:pre-wrap;padding:1rem;">${b.dataset.text}</pre>`);
      }));
      document.querySelectorAll('.copy-btn').forEach(b => b.addEventListener('click', () => {
        navigator.clipboard.writeText(b.dataset.text).then(() => showToast('已复制到剪贴板')).catch(() => showToast('复制失败', true));
      }));
    }

    function findFile(id) {
      return state.translateFiles.find(f => f.id === id) || state.convertFiles.find(f => f.id === id);
    }

    async function processFile(f) {
      if (f.type === 'translate') await translateFile(f);
      else await convertFile(f);
    }

    async function translateFile(f) {
      f.status='extracting'; f.progress=0; renderAll();
      try {
        const text = await extractText(f.file, f.ext);
        if (!text.trim()) throw new Error('没有文字');
        f.extractedText = text; f.status='translating'; f.progress=0; renderAll();
        const translated = await callProxy(text, f.targetLang);
        f.translatedText = translated;
        const { blob, filename } = await generateOutput(translated, f.extractedText, f.fmt, f.name);
        f.blobUrl = URL.createObjectURL(blob); f.filename = filename; f.status = 'done';
        state.translateFiles = state.translateFiles.filter(x => x.id !== f.id);
        state.completed.push(f); addRecord(f);
        showToast('翻译完成');
      } catch(e) { f.status='error'; showToast(`翻译失败: ${e.message}`, true); }
      renderAll();
    }

    async function convertFile(f) {
      f.status='extracting'; f.progress=0; renderAll();
      try {
        const text = await extractText(f.file, f.ext);
        if (!text.trim()) throw new Error('没有文字');
        f.extractedText = text;
        const { blob, filename } = await generateOutput(text, text, f.fmt, f.name, true);
        f.blobUrl = URL.createObjectURL(blob); f.filename = filename; f.status = 'done';
        state.convertFiles = state.convertFiles.filter(x => x.id !== f.id);
        state.completed.push(f); addRecord(f);
        showToast('转换完成');
      } catch(e) { f.status='error'; showToast(`转换失败: ${e.message}`, true); }
      renderAll();
    }

    // ==================== 核心修复：稳健版 callProxy ====================
    async function callProxy(text, target) {
      try {
        const res = await fetch(API_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, target })
        });
        const data = await res.json();
        
        console.log("翻译接口返回:", data);

        // 如果 code 不是 0，但 result 存在，说明是接口的警告，依然放行
        if (data.code !== 0) {
          console.warn("翻译接口返回非0状态码:", data.code, data);
          // 如果 result 没值，才真的抛出异常
          if (!data.result) {
            throw new Error(data.error || data.message || '翻译接口返回错误');
          }
        }

        // 返回 result（必须在 data 里存在）
        if (data.result === undefined) {
            throw new Error('翻译接口没有返回翻译内容');
        }
        return data.result;

     } catch (err) {
       console.error("callProxy 捕获错误:", err);
       // 👇 加入这行，让浏览器弹窗告诉你具体错误是什么
      alert("DEBUG: 具体错误信息 -> " + JSON.stringify(err));
      throw new Error(err.message || '翻译接口错误');
     }
    }

    async function extractText(file, ext) {
      switch(ext) {
        case 'pdf': return await extractPDF(file);
        case 'docx': case 'doc': return await extractDocx(file);
        case 'txt': return await file.text();
        case 'png': case 'jpg': case 'jpeg': return await extractImage(file);
        default: throw new Error('不支持');
      }
    }

    async function extractPDF(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      let text = '';
      for (let i=1; i<=pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      return text.replace(/\s{2,}/g, ' ').trim();
    }

    async function extractDocx(file) {
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer: buf});
      return result.value.trim();
    }

    async function extractImage(file) {
      const worker = await Tesseract.createWorker('eng', 1);
      const { data: { text } } = await worker.recognize(file);
      await worker.terminate();
      return text.trim();
    }

    async function generateOutput(translated, original, fmt, originalName, isConvert = false) {
      const base = originalName.replace(/\.[^.]+$/, '');
      const prefix = isConvert ? '_转换' : '_翻译';
      switch(fmt) {
        case 'pdf': return await genPDF(translated || '', base + prefix);
        case 'docx': return await genDOCX(translated || '', base + prefix);
        case 'txt': return genTXT(translated || '', base + prefix);
        case 'html': return genHTML(translated || '', base + prefix);
        case 'bilingual': return genBilingual(original || '', translated || '', base + prefix);
        default: return genTXT(translated || '', base + prefix);
      }
    }

    async function genPDF(text, name) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const maxW = doc.internal.pageSize.getWidth() - 40;
      doc.setFontSize(12);
      doc.text(doc.splitTextToSize(text || '', maxW), 20, 20);
      return { blob: doc.output('blob'), filename: `${name}.pdf` };
    }

    async function genDOCX(text, name) {
      const { Document, Packer, Paragraph, TextRun } = docx;
      const paras = (text || '').split('\n\n').filter(p => p.trim()).map(p =>
        new Paragraph({ children: [new TextRun({text: (p || '').trim(), size:24})], spacing:{after:200}, indent:{firstLine:480} })
      );
      const blob = await Packer.toBlob(new Document({ sections: [{children: paras}] }));
      return { blob, filename: `${name}.docx` };
    }

    function genTXT(text, name) {
      return { blob: new Blob(['\uFEFF' + (text || '')], {type:'text/plain'}), filename: `${name}.txt` };
    }

    function genHTML(text, name) {
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${name}</title></head><body>${(text || '').split('\n\n').map(p=>`<p>${p}</p>`).join('')}</body></html>`;
      return { blob: new Blob(['\uFEFF'+html], {type:'text/html'}), filename: `${name}.html` };
    }

    function genBilingual(orig, trans, name) {
      const op = (orig || '').split('\n\n'), tp = (trans || '').split('\n\n');
      let rows = '';
      for (let i=0; i<Math.max(op.length, tp.length); i++) rows += `<tr><td>${op[i]||''}</td><td>${tp[i]||''}</td></tr>`;
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>双语-${name}</title><style>table{width:100%;border-collapse:collapse}td{width:50%;padding:8px;border:1px solid #ddd}</style></head><body><table>${rows}</table></body></html>`;
      return { blob: new Blob(['\uFEFF'+html], {type:'text/html'}), filename: `${name}.html` };
    }

    function showToast(msg, err=false) {
      toast.textContent = msg; toast.style.background = err ? '#dc2626' : '#1e293b';
      toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

    // 初始化
    updateLoginUI();
    renderAll();
  })();
</script>
